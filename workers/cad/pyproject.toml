[project]
name = "blueprint-cad-worker"
version = "0.1.0"
description = "Isolated CadQuery/Open CASCADE geometry worker for Blueprint to CAD"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
